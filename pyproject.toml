[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-tuning-assistant"
version = "0.1.0"
description = "基于多模态识别与 RAG 的相机拍摄参数助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
camera-knowledge = "camera_assistant.knowledge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
