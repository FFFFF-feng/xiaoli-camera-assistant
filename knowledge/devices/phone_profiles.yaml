    notes:
      - 未收录不等于不支持；仅提供照片模式的通用操作，不借用相近型号参数。
      - 镜头、系统、相机应用、手动控制和曝光范围都需要用户确认。
  - profile_id: apple_iphone_15
    brand: Apple
    model: iPhone 15
    display_name: Apple iPhone 15
    aliases: [iPhone 15, 苹果15, 苹果 15]
    native_app: Apple 相机
    modes: [auto, portrait, night]
    pro_controls: []
    lenses:
      - lens_id: main
        modes: [auto, portrait, night]
        name: 主摄（1×）
        aperture: 1.6
        aperture_control: fixed
        equivalent_focal_length_mm: 26
      - lens_id: ultrawide
        name: 超广角（0.5×）
        aperture: 2.4
        aperture_control: fixed
        equivalent_focal_length_mm: 13
    source_urls:
      - https://support.apple.com/zh-cn/111831
