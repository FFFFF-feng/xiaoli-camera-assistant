    checked_at: '2026-10-10'
    region_scope: Apple中国规格页；当前iOS菜单需真机确认
    notes:
      - 本档案仅指iPhone 15，不代表15 Pro、Plus、Pro Max或其他代际。
      - 2×取景由主摄传感器实现，不记录成独立长焦镜头；本版先提供两个物理后置镜头。
      - 原生相机本版不推荐直接输入ISO、快门或物理光圈；人像景深滑块不等于改变物理光圈。
      - 不从相近型号继承Apple ProRAW或夜间人像等额外能力。
