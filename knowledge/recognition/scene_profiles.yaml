version: 1
profiles:
  - id: outdoor_portrait
    label: 户外自然光人像
    category: portrait
    aliases: [portrait, outdoor portrait, person]
    description: 户外以人物为主要主体，强调人脸曝光、眼部对焦和景深控制。
    subject: person
    environment: outdoor
    default_motion: static
    keywords: [人像, 人物, 女生, 男生, 模特, 背景虚化, 户外人像]
    user_motion: [静止, 缓慢]
    brightness: [medium, high]
    equipment: [handheld, tripod]
    retrieval_terms: [户外人像, 自然光, 背景虚化, 眼部对焦]

  - id: indoor_portrait
    label: 室内弱光人像
    category: portrait
    aliases: [indoor portrait]
    description: 室内人物拍摄，通常需要兼顾肤色、快门和高 ISO 噪点。
    subject: person
    environment: indoor
    default_motion: slow
    keywords: [室内人像, 房间拍人, 室内人物, 咖啡馆人像]
    user_motion: [静止, 缓慢]
    brightness: [low, medium]
    equipment: [handheld, tripod]
    retrieval_terms: [室内人像, 弱光, 肤色, 安全快门]

  - id: fast_pet
    label: 快速宠物
    category: pet
