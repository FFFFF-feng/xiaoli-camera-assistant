services:
  app:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    env_file: .env
    volumes:
      - xiaoli-data:/app/data
    expose:
      - "8080"
    networks:
      default:
        ipv4_address: 172.30.71.3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    cpus: 2
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      XIAOLI_DOMAIN: ${XIAOLI_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.71.2
    depends_on:
      app:
        condition: service_healthy
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.71.0/24
volumes:
  xiaoli-data:
  caddy-data:
  caddy-config:
